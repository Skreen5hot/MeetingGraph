# Publishes the product page to GitHub Pages on every push to main.
# The site is dist/MeetingGraph2.html as index.html, plus the CSV templates the page refers to.
# Nothing is built here: the page is committed already built (python3 src/v2/build_v2.py).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/templates
          cp dist/MeetingGraph2.html _site/index.html
          cp dist/MeetingGraph2.html _site/MeetingGraph2.html
          cp templates/* _site/templates/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
